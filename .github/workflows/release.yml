# Builds the Windows and Android apps and publishes them as GitHub Release
# assets. Runs only for an intentional release tag (v*), or manually; manual
# runs build and upload workflow artifacts but never publish a release.
#
# Required repository secrets for a signed APK (Settings > Secrets > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the Android job fails instead of publishing an unsigned APK.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (MinGW-w64 GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
            zip
      - name: Configure
        run: cmake --preset release -DNOVACAST_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Package
        run: |
          version=$(head -n1 VERSION)
          mkdir -p out/NovaCast-$version-windows-x64
          cp build/release/bin/novacast.exe out/NovaCast-Windows.exe
          cp build/release/bin/novacast.exe out/NovaCast-$version-windows-x64/
          cp docs/PROGRESS.md out/NovaCast-$version-windows-x64/
          cd out
          zip -qr NovaCast-Windows.zip NovaCast-$version-windows-x64
          sha256sum NovaCast-Windows.exe NovaCast-Windows.zip > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/NovaCast-Windows.exe
            out/NovaCast-Windows.zip
            out/SHA256SUMS-windows.txt
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to build an unsigned release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          NOVACAST_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          NOVACAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOVACAST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOVACAST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify signature and package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p ../out
          cp "$apk" ../out/NovaCast-Android.apk
          cd ../out && sha256sum NovaCast-Android.apk > SHA256SUMS-android.txt
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            out/NovaCast-Android.apk
            out/SHA256SUMS-android.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/NovaCast-Windows.exe
            dist/NovaCast-Windows.zip
            dist/SHA256SUMS-windows.txt
            dist/NovaCast-Android.apk
            dist/SHA256SUMS-android.txt
